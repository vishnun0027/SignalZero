name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration (Tests & Lint)
    runs-on: ubuntu-latest

    env:
      # Dummy values so modules can import without crashing.
      # All real I/O is mocked inside the test suite.
      DATABASE_URL: "sqlite:///./test.db"
      GROQ_API_KEY: "ci-dummy-key"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run Tests
        run: uv run pytest tests/unit/ -v --tb=short

  cd:
    name: Continuous Deployment (Ubuntu Cloud Instance)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Ubuntu VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            
            # Enable systemd user manager lingering and export session variables
            loginctl enable-linger || true
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            
            echo "=== Probing Remote Server Environment ==="
            echo "Current User: $(whoami)"
            echo "Home Directory: $HOME"
            echo "Current Path: $(pwd)"
            echo "Directories in $HOME:"
            ls -la $HOME
            
            # Find the correct directory or clone it
            APP_DIR=""
            if [ -d "$HOME/worklab/SignalZero" ]; then
              APP_DIR="$HOME/worklab/SignalZero"
            elif [ -d "$HOME/SignalZero" ]; then
              APP_DIR="$HOME/SignalZero"
            else
              # Search for SignalZero in $HOME
              FOUND_DIR=$(find $HOME -maxdepth 3 -type d -name "SignalZero" | head -n 1)
              if [ -n "$FOUND_DIR" ]; then
                APP_DIR="$FOUND_DIR"
              else
                echo "--- SignalZero directory not found, cloning to $HOME/worklab/SignalZero ---"
                mkdir -p "$HOME/worklab"
                git clone https://github.com/vishnun0027/SignalZero.git "$HOME/worklab/SignalZero"
                APP_DIR="$HOME/worklab/SignalZero"
                # Copy example env to .env if not exists
                if [ ! -f "$APP_DIR/.env" ]; then
                  cp "$APP_DIR/.env.example" "$APP_DIR/.env"
                fi
              fi
            fi

            echo "✅ Deploying to APP_DIR: $APP_DIR"
            cd "$APP_DIR"
            export PATH="$HOME/.local/bin:$PATH"

            echo "--- Pulling latest code ---"
            git reset --hard HEAD
            git pull origin main

            echo "--- Syncing dependencies ---"
            uv sync --frozen

            echo "--- Installing systemd service files ---"
            mkdir -p ~/.config/systemd/user/
            for f in config/systemd/signalzero*.service; do
              basename_f=$(basename "$f")
              sed -e "s|/home/vishnu/worklab/SignalZero|$APP_DIR|g" \
                  -e "/^User=/d" \
                  -e "/^Group=/d" \
                  "$f" > ~/.config/systemd/user/"$basename_f"
            done
            for f in config/systemd/signalzero*.timer; do
              basename_f=$(basename "$f")
              cp "$f" ~/.config/systemd/user/"$basename_f"
            done

            echo "--- Reloading systemd and restarting services ---"
            systemctl --user daemon-reload
            systemctl --user enable signalzero_api.service signalzero.timer signalzero_digest.timer
            systemctl --user restart signalzero_api.service signalzero.timer signalzero_digest.timer

            echo "--- Verifying deployment (health check) ---"
            HEALTH_PASSED=false
            for i in {1..8}; do
              echo "Health check attempt $i/8..."
              if curl --fail --silent --show-error http://localhost:8007/api/health; then
                echo "✅ API health check passed"
                HEALTH_PASSED=true
                break
              fi
              sleep 5
            done

            if [ "$HEALTH_PASSED" = false ]; then
              echo "❌ API health check FAILED"
              echo "=== Journalctl API logs ==="
              journalctl --user -u signalzero_api.service -n 100 --no-pager || true
              echo "=== Service Status ==="
              systemctl --user status signalzero_api.service || true
              echo "=== signalzero.log content ==="
              cat "$APP_DIR/signalzero.log" || true
              exit 1
            fi

            echo "--- Checking service statuses ---"
            systemctl --user is-active --quiet signalzero_api.service \
              && echo "✅ signalzero_api.service is active" \
              || echo "⚠️  signalzero_api.service is NOT active"
            systemctl --user is-active --quiet signalzero.timer \
              && echo "✅ signalzero.timer is active" \
              || echo "⚠️  signalzero.timer is NOT active"
            systemctl --user is-active --quiet signalzero_digest.timer \
              && echo "✅ signalzero_digest.timer is active" \
              || echo "⚠️  signalzero_digest.timer is NOT active"
