3name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration (Tests & Lint)
    runs-on: ubuntu-latest

    env:
      # Dummy values so modules can import without crashing.
      # All real I/O is mocked inside the test suite.
      DATABASE_URL: "sqlite:///./test.db"
      GROQ_API_KEY: "ci-dummy-key"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run Tests
        run: uv run pytest tests/ -v --tb=short

  cd:
    name: Continuous Deployment (Ubuntu Cloud Instance)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Ubuntu VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd $HOME/worklab/SignalZero
            export PATH="$HOME/.local/bin:$PATH"

            echo "--- Pulling latest code ---"
            git reset --hard HEAD
            git pull origin main

            echo "--- Syncing dependencies ---"
            uv sync --frozen

            echo "--- Installing systemd service files ---"
            mkdir -p ~/.config/systemd/user/
            cp $HOME/worklab/SignalZero/signalzero*.service ~/.config/systemd/user/
            cp $HOME/worklab/SignalZero/signalzero*.timer ~/.config/systemd/user/

            echo "--- Reloading systemd and restarting services ---"
            systemctl --user daemon-reload
            systemctl --user enable signalzero_api.service signalzero.timer signalzero_digest.timer
            systemctl --user restart signalzero_api.service signalzero.timer signalzero_digest.timer

            echo "--- Verifying deployment (health check) ---"
            sleep 5
            curl --fail --silent --show-error http://localhost:8007/api/health \
              && echo "✅ API health check passed" \
              || (echo "❌ API health check FAILED" && exit 1)

            echo "--- Checking service statuses ---"
            systemctl --user is-active --quiet signalzero_api.service \
              && echo "✅ signalzero_api.service is active" \
              || echo "⚠️  signalzero_api.service is NOT active"
            systemctl --user is-active --quiet signalzero.timer \
              && echo "✅ signalzero.timer is active" \
              || echo "⚠️  signalzero.timer is NOT active"
            systemctl --user is-active --quiet signalzero_digest.timer \
              && echo "✅ signalzero_digest.timer is active" \
              || echo "⚠️  signalzero_digest.timer is NOT active"
