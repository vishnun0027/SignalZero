name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration (Tests & Lint)
    runs-on: ubuntu-latest

    env:
      # Dummy values so modules can import without crashing.
      # All real I/O is mocked inside the test suite.
      DATABASE_URL: "sqlite:///./test.db"
      GROQ_API_KEY: "ci-dummy-key"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run Tests
        run: uv run pytest tests/unit/ -v --tb=short

  cd:
    name: Continuous Deployment (Ubuntu Cloud Instance)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Ubuntu VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOTENV_CONTENT: ${{ secrets.DOTENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DOTENV_CONTENT
          script: |
            set -e
            
            # Find the correct directory or clone it
            APP_DIR=""
            if [ -d "$HOME/worklab/SignalZero" ]; then
              APP_DIR="$HOME/worklab/SignalZero"
            elif [ -d "$HOME/SignalZero" ]; then
              APP_DIR="$HOME/SignalZero"
            else
              # Search for SignalZero in $HOME
              FOUND_DIR=$(find $HOME -maxdepth 3 -type d -name "SignalZero" | head -n 1)
              if [ -n "$FOUND_DIR" ]; then
                APP_DIR="$FOUND_DIR"
              else
                echo "--- SignalZero directory not found, cloning to $HOME/worklab/SignalZero ---"
                mkdir -p "$HOME/worklab"
                git clone https://github.com/vishnun0027/SignalZero.git "$HOME/worklab/SignalZero"
                APP_DIR="$HOME/worklab/SignalZero"
              fi
            fi

            echo "✅ Deploying to APP_DIR: $APP_DIR"
            cd "$APP_DIR"
            git reset --hard HEAD
            git pull origin main
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
